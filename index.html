<style>

.gate{min-height:80vh;display:flex;align-items:center;justify-content:center;padding-block:24px}.panel{width:100%;max-width:420px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 24px 24px;display:flex;flex-direction:column;gap:22px;box-shadow:0 12px 40px rgba(20,33,61,.1)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.lock{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--bg);color:var(--accent);border:1px solid var(--line);transition:background .25s,color .25s}.lock svg{width:26px;height:26px}.lock.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.lock.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}h1{font-size:30px;line-height:1.1;font-weight:700;margin:0;text-wrap:balance}.sub{margin:6px 0 0;color:var(--muted)}form{display:flex;flex-direction:column;gap:16px}label{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}input[type=text]{width:100%;min-height:54px;margin-top:8px;padding:0 16px;font:500 18px var(--font-mono);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px}input[type=text]:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-color:var(--accent)}button{min-height:50px;padding:0 18px;border:0;border-radius:12px;font:700 16px var(--font-display);cursor:pointer;background:var(--accent);color:var(--accent-fg)}button.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:active{transform:translateY(1px)}button:disabled{opacity:.5;cursor:default}.verdict{display:flex;flex-direction:column;gap:16px}.verdict .tag{align-self:flex-start;font-family:var(--font-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px}.verdict.ok .tag{background:var(--ok-bg);color:var(--ok)}.verdict.bad .tag{background:var(--bad-bg);color:var(--bad)}.alert{font-family:var(--font-mono);font-size:14px;color:var(--bad);background:var(--bad-bg);border-radius:12px;padding:14px 16px;overflow-wrap:anywhere}
.app{max-width:720px;margin:0 auto;padding-bottom:40px}.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line)}.bar-in{display:flex;align-items:center;gap:10px;min-width:0}.bar h2{flex:1;min-width:0;margin:0;font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icon-btn{min-height:44px;min-width:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel);color:var(--fg);border:1.5px solid var(--line);font-size:14px}.icon-btn svg{width:20px;height:20px;flex:none}.status{min-height:1.5em;margin:10px 0 0;font-family:var(--font-mono);font-size:13px;color:var(--muted);overflow-wrap:anywhere}.status.err{color:var(--bad)}.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:14px 0 12px;font-family:var(--font-mono);font-size:13px;color:var(--muted)}.crumbs button{min-height:32px;padding:0 8px;border-radius:8px;background:transparent;color:var(--accent);font:500 13px var(--font-mono)}.crumbs .here{color:var(--fg);padding:0 8px;overflow-wrap:anywhere}.crumbs .sep{opacity:.5}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(min-width:560px){.actions{grid-template-columns:repeat(4,minmax(0,1fr))}}.actions button{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;padding:0 10px}.actions button svg{width:18px;height:18px;flex:none}.namer{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-top:12px}.namer .field{flex:1 1 200px;min-width:0}.drop{margin-top:16px;border:2px dashed transparent;border-radius:16px;transition:border-color .15s,background .15s}.drop.over{border-color:var(--accent);background:var(--accent-soft)}.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.row{width:100%;min-height:64px;padding:10px 14px;display:flex;align-items:center;gap:14px;text-align:left;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px}.row .ico{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--accent-soft);color:var(--accent)}.row .ico svg{width:22px;height:22px}.row .txt{min-width:0;flex:1;display:flex;flex-direction:column}.row .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .meta{font-family:var(--font-mono);font-size:12px;color:var(--muted)}.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px}.empty strong{display:block;color:var(--fg);font-size:18px;margin-bottom:4px}.danger-zone{margin-top:20px;display:flex;justify-content:flex-end}button.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}button.danger.armed{background:var(--bad);color:var(--bg)}.item-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin:14px 0 12px}.item-head .field{flex:1 1 220px;min-width:0}.item-head input{margin-top:6px;min-height:48px;font-size:16px}.item-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.item-tools .save-state{flex:1 1 160px;font-family:var(--font-mono);font-size:13px;color:var(--muted)}.item-tools .save-state.err{color:var(--bad)}textarea#ed-text{width:100%;min-height:56vh;resize:vertical;padding:14px 16px;font:400 15px/1.55 var(--font-mono);color:var(--fg);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;tab-size:2}.preview{margin-top:8px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}.preview img,.preview video{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:var(--panel)}.preview .info{font-family:var(--font-mono);font-size:13px;color:var(--muted)}a.btn-link{display:inline-flex;align-items:center;min-height:50px;padding:0 18px;border-radius:12px;text-decoration:none;font-weight:700;background:var(--accent);color:var(--accent-fg)}@media(prefers-reduced-motion:no-preference){.shake{animation:shake .35s}@keyframes shake{20%{transform:translateX(-6px)}60%{transform:translateX(6px)}100%{transform:none}}}
</style>
</head>
<body>
<div id="gate" class="gate"><main class="panel"><div class="top"><span class="badge" id="step-label">Étape 1 sur 2</span><div class="lock" id="lock" aria-hidden="true"><svg id="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></div></div>
<section id="step1"><h1>Contrôle d'accès</h1><p class="sub">Entrez votre nom pour continuer.</p><form id="form1" autocomplete="off" style="margin-top:20px"><div><label for="nom">Nom</label><input type="text" id="nom" name="nom" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" required></div><button type="submit">Continuer</button></form></section>
<section id="step2" hidden><h1>Votre prénom</h1><p class="sub">Dernière vérification avant l'accès.</p><form id="form2" autocomplete="off" style="margin-top:20px"><div><label for="prenom">Prénom</label><input type="text" id="prenom" name="prenom" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" required></div><button type="submit">Vérifier</button></form></section>
<section id="result" hidden><div class="verdict" id="verdict"><span class="tag" id="tag"></span><h1 id="result-title"></h1><div class="alert" id="alert" hidden>Tentatives de piratage +++</div><button type="button" id="enter" hidden>Ouvrir mon espace</button><button type="button" class="ghost" id="restart">Recommencer</button></div></section></main></div>
<div id="app" class="app" hidden><header class="bar"><div class="bar-in"><button type="button" class="icon-btn" id="btn-back" aria-label="Retour" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><h2 id="bar-title">Mon espace</h2><button type="button" class="icon-btn" id="btn-lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Verrouiller</span></button></div></header><p id="status" class="status" role="status"></p>
<section id="s-list"><nav id="crumbs" class="crumbs" aria-label="Chemin"></nav><div class="actions"><button type="button" id="a-text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Texte</button><button type="button" id="a-folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Dossier</button><button type="button" id="a-files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>Fichiers</button><button type="button" id="a-dir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>Un dossier</button></div><input type="file" id="in-files" multiple hidden><input type="file" id="in-dir" webkitdirectory multiple hidden>
<form id="namer" class="namer" hidden><div class="field"><label for="namer-in" id="namer-label">Nom</label><input type="text" id="namer-in" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="120"></div><button type="submit">Créer</button><button type="button" class="ghost" id="namer-cancel">Annuler</button></form><div id="drop" class="drop"><ul id="items" class="items"></ul><div id="empty" class="empty" hidden></div></div><div class="danger-zone" id="folder-danger" hidden><button type="button" class="danger" id="del-folder">Supprimer ce dossier</button></div></section>
<section id="s-edit" hidden><div class="item-head"><div class="field"><label for="ed-name">Nom du fichier</label><input type="text" id="ed-name" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="120"></div></div><textarea id="ed-text" aria-label="Contenu du fichier" spellcheck="false"></textarea><div class="item-tools"><span class="save-state" id="save-state">Enregistré</span><button type="button" id="ed-save">Enregistrer</button><button type="button" class="ghost" id="ed-dl">Télécharger</button><button type="button" class="danger" id="ed-del">Supprimer</button></div></section>
<section id="s-view" hidden><div class="item-head"><div class="field"><label for="vw-name">Nom du fichier</label><input type="text" id="vw-name" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="120"></div></div><div class="preview" id="vw-preview"></div><div class="item-tools"><button type="button" class="ghost" id="vw-dl">Télécharger</button><button type="button" class="danger" id="vw-del">Supprimer</button></div></section></div>
<script>
(function(){
"use strict";
var NOM="tanon",PRENOM="seth",MAXTEXT=200000,$=function(id){return document.getElementById(id)};
var S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">',ICON={locked:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',open:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>',denied:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>'};
var KIND={folder:S+'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',text:S+'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',image:S+'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',video:S+'<rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2v8l-4-2"/></svg>',pdf:S+'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',other:S+'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>'};
var lock=$("lock"),lockIcon=$("lock-icon");
function setLock(kind){lockIcon.innerHTML=ICON[kind==="ok"?"open":kind==="bad"?"denied":"locked"];lock.className="lock"+(kind?" "+kind:"")}
function showGateStep(id){["step1","step2","result"].forEach(function(s){$(s).hidden=s!==id})}
function verdict(kind,title,hacking){showGateStep("result");$("step-label").textContent="Résultat";$("verdict").className="verdict "+kind;$("tag").textContent=kind==="ok"?"Autorisé":"Refusé";$("result-title").textContent=title;$("alert").hidden=!hacking;$("enter").hidden=kind!=="ok";$("restart").hidden=kind==="ok";setLock(kind);(kind==="ok"?$("enter"):$("restart")).focus()}
function clean(v){return v.trim().toLowerCase()}
$("form1").addEventListener("submit",function(e){e.preventDefault();if(clean($("nom").value)===NOM){showGateStep("step2");$("step-label").textContent="Étape 2 sur 2";$("prenom").focus()}else verdict("bad","Accès refusé",true)});
$("form2").addEventListener("submit",function(e){e.preventDefault();if(clean($("prenom").value)===PRENOM)verdict("ok","Accès autorisé",false);else verdict("bad","Accès refusé",false)});
function resetGate(){$("nom").value="";$("prenom").value="";showGateStep("step1");$("step-label").textContent="Étape 1 sur 2";setLock("")}
$("restart").addEventListener("click",function(){resetGate();$("nom").focus()});
$("enter").addEventListener("click",function(){$("gate").hidden=true;$("app").hidden=false;state.screen="list";render();window.scrollTo(0,0)});
$("btn-lock").addEventListener("click",function(){flushSave().then(function(){$("app").hidden=true;$("gate").hidden=false;resetGate();$("nom").focus()})});setLock("");
var db=null,assets=null,downloads=null,uid=null,col=null,items=[],byId={},ready=false,storageError="",state={screen:"list",folder:"",id:null},busy=false;
function cap(name){try{if(window.claude&&window.claude.use)return window.claude.use(name).catch(function(){return null})}catch(e){}return Promise.resolve(null)}
function reindex(list){items=list;byId={};items.forEach(function(it){byId[it.id]=it})}
function upsertLocal(obj){if(byId[obj.id])return;items.push(obj);byId[obj.id]=obj}
function init(){Promise.all([cap("user"),cap("db"),cap("assets"),cap("downloads")]).then(function(r){var user=r[0];db=r[1];assets=r[2];downloads=r[3];return(user?user.id():Promise.resolve(null)).then(function(id){uid=id;if(!db||!uid){storageError="no-storage";ready=true;render();return}col=db.collection("data/users/"+uid);col.onSnapshot(function(snap){reindex(snap.docs.map(function(d){return Object.assign({id:d.id},d.data())}));ready=true;storageError="";render()},function(err){storageError=err&&err.code||"error";ready=true;render()})})})}
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
function byteLen(s){return new TextEncoder().encode(s).length}
function fmtSize(n){if(!n&&n!==0)return"";if(n<1024)return n+" o";if(n<1048576)return Math.round(n/1024)+" Ko";return(n/1048576).toFixed(1).replace(".",",")+" Mo"}
function fmtDate(ms){if(!ms)return"";return new Date(ms).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}
function setStatus(msg,isErr){var s=$("status");s.textContent=msg||"";s.className="status"+(isErr?" err":"")}
function ext(name){var i=name.lastIndexOf(".");return i<0?"":name.slice(i+1).toLowerCase()}
var TEXT_EXT=["txt","md","markdown","json","csv","tsv","js","mjs","css","html","htm","xml","py","java","c","cpp","h","sh","sql","yml","yaml","ini","log","php","rb","go","rs","ts","tsx","jsx","env","conf","cfg","toml","svg"];
function isText(name,file){var e=ext(name);if(e==="svg")return false;return TEXT_EXT.indexOf(e)>=0||(file.type&&file.type.indexOf("text/")===0)}
var ASSET_TYPE={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",svg:"image/svg+xml",mp4:"video/mp4",webm:"video/webm",pdf:"application/pdf",csv:"text/csv",md:"text/markdown",markdown:"text/markdown",json:"application/json",css:"text/css",js:"text/javascript",mjs:"text/javascript"};
function assetType(name,file){var e=ext(name);if(ASSET_TYPE[e])return ASSET_TYPE[e];if(isText(name,file))return"text/plain";return null}
function kindOf(it){if(it.kind==="folder")return"folder";if(it.store==="text")return"text";var m=it.mime||"";if(m.indexOf("image/")===0)return"image";if(m.indexOf("video/")===0)return"video";if(m==="application/pdf")return"pdf";return"other"}
function children(parent){return items.filter(function(it){return(it.parent||"")===parent})}
function sortItems(list){return list.slice().sort(function(a,b){if((a.kind==="folder")!==(b.kind==="folder"))return a.kind==="folder"?-1:1;return String(a.name).localeCompare(String(b.name),"fr",{numeric:true,sensitivity:"base"})})}
function uniqueName(parent,name,extra){var taken={};children(parent).forEach(function(it){taken[it.name]=true});(extra||[]).forEach(function(n){taken[n]=true});if(!taken[name])return name;var i=name.lastIndexOf("."),base=i>0?name.slice(0,i):name,tail=i>0?name.slice(i):"",n=2;while(taken[base+" ("+n+")"+tail])n++;return base+" ("+n+")"+tail}
function errText(e){var c=e&&e.code;if(c==="quota_exceeded"||c==="quota_or_state")return"Espace de stockage plein.";if(c==="too_large")return"Fichier trop volumineux (20 Mo maximum).";if(c==="unsupported_type")return"Format non pris en charge.";if(c==="rate_limited"||c==="resource_exhausted")return"Trop d'opérations d'un coup. Réessaie dans un instant.";return"Une erreur est survenue. Réessaie."}
function showScreen(name){state.screen=name;$("s-list").hidden=name!=="list";$("s-edit").hidden=name!=="edit";$("s-view").hidden=name!=="view";$("btn-back").hidden=name==="list"&&!state.folder}
function render(){if($("app").hidden)return;if(state.screen==="list")renderList();else refreshItemScreen()}
function renderList(){showScreen("list");var cur=state.folder&&byId[state.folder];if(state.folder&&!cur&&ready&&!storageError){state.folder="";cur=null}$("bar-title").textContent=cur?cur.name:"Mon espace";$("btn-back").hidden=!state.folder;$("folder-danger").hidden=!cur;var crumbs=$("crumbs");crumbs.textContent="";var path=[],f=cur;while(f){path.unshift(f);f=f.parent?byId[f.parent]:null}var root=el("button",null,"Mon espace");root.type="button";root.addEventListener("click",function(){goFolder("")});if(!path.length)crumbs.appendChild(el("span","here","Mon espace"));else{crumbs.appendChild(root);path.forEach(function(p,i){crumbs.appendChild(el("span","sep","/"));if(i===path.length-1)crumbs.appendChild(el("span","here",p.name));else{var b=el("button",null,p.name);b.type="button";b.addEventListener("click",function(){goFolder(p.id)});crumbs.appendChild(b)}})}var disabled=!col||busy;["a-text","a-folder","a-files","a-dir"].forEach(function(id){$(id).disabled=disabled});var list=$("items"),empty=$("empty");list.textContent="";var kids=sortItems(children(state.folder));kids.forEach(function(it){var li=el("li"),b=el("button","row");b.type="button";var ico=el("span","ico");ico.innerHTML=KIND[kindOf(it)];var txt=el("span","txt");txt.appendChild(el("span","nm",it.name));var meta;if(it.kind==="folder"){var n=children(it.id).length;meta="Dossier · "+n+(n>1?" éléments":" élément")}else meta=fmtSize(it.size)+(it.updated?" · "+fmtDate(it.updated):"");txt.appendChild(el("span","meta",meta));b.appendChild(ico);b.appendChild(txt);b.addEventListener("click",function(){openItem(it.id)});li.appendChild(b);list.appendChild(li)});if(!ready){empty.hidden=false;empty.textContent="Chargement de tes fichiers…"}else if(storageError){empty.hidden=false;empty.textContent="";empty.appendChild(el("strong",null,"Stockage indisponible"));empty.appendChild(document.createTextNode("Ouvre cette page dans l'application Claude, connecté à ton compte, pour utiliser ton espace de fichiers."))}else if(!kids.length){empty.hidden=false;empty.textContent="";empty.appendChild(el("strong",null,state.folder?"Ce dossier est vide":"Ton espace est vide"));empty.appendChild(document.createTextNode("Dépose des fichiers ou un dossier ici, ou utilise les boutons ci-dessus."))}else empty.hidden=true}
function goFolder(id){state.folder=id;$("namer").hidden=true;setStatus("");resetArmed();renderList();window.scrollTo(0,0)}
$("btn-back").addEventListener("click",function(){if(state.screen==="list"){var cur=byId[state.folder];goFolder(cur&&cur.parent?cur.parent:"")}else flushSave().then(function(){setStatus("");resetArmed();goFolder(state.folder)})});
var namerMode=null;function openNamer(mode){namerMode=mode;$("namer-label").textContent=mode==="folder"?"Nom du dossier":"Nom du fichier texte";$("namer-in").value=mode==="folder"?"":"note.txt";$("namer").hidden=false;$("namer-in").focus();$("namer-in").select()}
$("a-text").addEventListener("click",function(){openNamer("text")});$("a-folder").addEventListener("click",function(){openNamer("folder")});$("namer-cancel").addEventListener("click",function(){$("namer").hidden=true});
$("namer").addEventListener("submit",function(e){e.preventDefault();var raw=$("namer-in").value.trim().replace(/[\/\\]/g,"-");if(!raw||!col)return;var name=uniqueName(state.folder,raw),ref=col.doc(),obj=namerMode==="folder"?{kind:"folder",name:name,parent:state.folder,updated:Date.now()}:{kind:"file",store:"text",name:name,parent:state.folder,content:"",size:0,mime:"text/plain",updated:Date.now()};$("namer").hidden=true;ref.set(obj).then(function(){upsertLocal(Object.assign({id:ref.id},obj));if(obj.kind==="folder")renderList();else{openItem(ref.id);$("ed-text").focus()}}).catch(function(err){setStatus(errText(err),true)})});
$("a-files").addEventListener("click",function(){$("in-files").click()});$("a-dir").addEventListener("click",function(){$("in-dir").click()});
$("in-files").addEventListener("change",function(e){var list=[].slice.call(e.target.files).map(function(f){return{file:f,path:f.name}});e.target.value="";importBatch(list)});
$("in-dir").addEventListener("change",function(e){var list=[].slice.call(e.target.files).map(function(f){return{file:f,path:f.webkitRelativePath||f.name}});e.target.value="";importBatch(list)});
function findFolder(parent,name){for(var i=0;i<items.length;i++){var it=items[i];if(it.kind==="folder"&&(it.parent||"")===parent&&it.name===name)return it.id}return null}
async function ensureFolder(parent,name,cache,key){if(cache[key])return cache[key];var id=findFolder(parent,name);if(!id){var ref=col.doc(),obj={kind:"folder",name:name,parent:parent,updated:Date.now()};await ref.set(obj);upsertLocal(Object.assign({id:ref.id},obj));id=ref.id}cache[key]=id;return id}
async function addFile(parent,name,file,used){var finalName=uniqueName(parent,name,used);used.push(finalName);var ref=col.doc(),obj;if(isText(name,file)&&file.size<=MAXTEXT){var text=await file.text();if(byteLen(text)<=MAXTEXT)obj={kind:"file",store:"text",name:finalName,parent:parent,content:text,size:byteLen(text),mime:"text/plain",updated:Date.now()}}if(!obj){var type=assetType(name,file);if(!type){var u=new Error("unsupported");u.code="unsupported_type";throw u}if(!assets){var n=new Error("noassets");n.code="unsupported_type";throw n}var res=await assets.upload(file,{type:type});obj={kind:"file",store:"asset",name:finalName,parent:parent,assetId:res.id,mime:type,size:res.sizeBytes,updated:Date.now()}}await ref.set(obj);upsertLocal(Object.assign({id:ref.id},obj))}
async function importBatch(list){if(!col||!list.length||busy)return;busy=true;renderList();var parent=state.folder,cache={},usedByParent={},failed=[],last=null,done=0;for(var i=0;i<list.length;i++){var entry=list[i];setStatus("Import "+(i+1)+" sur "+list.length+"…");var parts=entry.path.split("/").filter(Boolean),name=parts.pop(),p=parent,key="";try{for(var j=0;j<parts.length;j++){key+="/"+parts[j];p=await ensureFolder(p,parts[j],cache,key)}usedByParent[p]=usedByParent[p]||[];await addFile(p,name,entry.file,usedByParent[p]);done++}catch(err){failed.push({name:name,err:err});last=err}}busy=false;renderList();if(!failed.length)setStatus(done+(done>1?" fichiers importés.":" fichier importé."));else{var names=failed.slice(0,3).map(function(f){return f.name}).join(", "),more=failed.length>3?" et "+(failed.length-3)+" autre(s)":"";setStatus(done+" importé(s). Non importé : "+names+more+". "+errText(last),true)}}
function walk(entry,prefix,out){return new Promise(function(resolve){if(entry.isFile)entry.file(function(f){out.push({file:f,path:prefix+f.name});resolve()},resolve);else if(entry.isDirectory){var reader=entry.createReader(),all=[];(function more(){reader.readEntries(function(es){if(!es.length)Promise.all(all.map(function(c){return walk(c,prefix+entry.name+"/",out)})).then(resolve);else{all=all.concat([].slice.call(es));more()}},resolve)})()}else resolve()})}
var drop=$("drop");document.addEventListener("dragover",function(e){e.preventDefault()});document.addEventListener("drop",function(e){e.preventDefault()});drop.addEventListener("dragover",function(e){e.preventDefault();drop.classList.add("over")});drop.addEventListener("dragleave",function(e){if(!drop.contains(e.relatedTarget))drop.classList.remove("over")});drop.addEventListener("drop",function(e){e.preventDefault();e.stopPropagation();drop.classList.remove("over");var dt=e.dataTransfer;if(!dt)return;var out=[],entries=[];if(dt.items&&dt.items.length&&dt.items[0].webkitGetAsEntry){for(var i=0;i<dt.items.length;i++){var en=dt.items[i].webkitGetAsEntry();if(en)entries.push(en)}Promise.all(entries.map(function(en){return walk(en,"",out)})).then(function(){importBatch(out)})}else importBatch([].slice.call(dt.files).map(function(f){return{file:f,path:f.name}}))});
var dirty=false,saving=false,timer=null;
function openItem(id){var it=byId[id];if(!it)return;setStatus("");resetArmed();if(it.kind==="folder"){goFolder(id);return}state.id=id;$("namer").hidden=true;$("btn-back").hidden=false;$("bar-title").textContent="Fichier";if(it.store==="text"){showScreen("edit");$("ed-name").value=it.name;$("ed-text").value=it.content||"";dirty=false;setSave("Enregistré")}else{showScreen("view");$("vw-name").value=it.name;fillPreview(it)}$("btn-back").hidden=false;window.scrollTo(0,0)}
function refreshItemScreen(){if(!ready)return;if(!byId[state.id]){state.screen="list";renderList()}}
function setSave(msg,isErr){var s=$("save-state");s.textContent=msg;s.className="save-state"+(isErr?" err":"")}
$("ed-text").addEventListener("input",function(){dirty=true;var n=byteLen($("ed-text").value);if(n>MAXTEXT){setSave("Trop volumineux : "+fmtSize(n)+" (maximum 200 Ko).",true);clearTimeout(timer);return}setSave("Modifications non enregistrées");clearTimeout(timer);timer=setTimeout(save,1500)});
async function save(){clearTimeout(timer);if(saving||!dirty||state.screen!=="edit")return;var it=byId[state.id];if(!it||!col)return;var text=$("ed-text").value,n=byteLen(text);if(n>MAXTEXT){setSave("Trop volumineux : "+fmtSize(n)+" (maximum 200 Ko). Non enregistré.",true);return}saving=true;setSave("Enregistrement…");try{await col.doc(it.id).update({content:text,size:n,updated:Date.now()});saving=false;if($("ed-text").value===text){dirty=false;setSave("Enregistré")}else return save()}catch(err){saving=false;setSave("Échec de l'enregistrement. Réessaie.",true)}}
function flushSave(){if(state.screen==="edit"&&dirty)return save();return Promise.resolve()}
$("ed-save").addEventListener("click",save);
function wireRename(inputId){var input=$(inputId);function commit(){var it=byId[state.id],name=input.value.trim().replace(/[\/\\]/g,"-");if(!it||!col)return;if(!name){input.value=it.name;return}if(name===it.name)return;col.doc(it.id).update({name:name,updated:Date.now()}).catch(function(err){setStatus(errText(err),true)})}input.addEventListener("change",commit);input.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();input.blur()}})}
wireRename("ed-name");wireRename("vw-name");
function fillPreview(it){var box=$("vw-preview");box.textContent="";var url="/_blob/"+it.assetId,k=kindOf(it);if(k==="image"){var img=el("img");img.alt=it.name;img.src=url;box.appendChild(img)}else if(k==="video"){var v=el("video");v.controls=true;v.playsInline=true;v.src=url;box.appendChild(v)}box.appendChild(el("span","info",(it.mime||"")+" · "+fmtSize(it.size)));var a=el("a","btn-link",k==="pdf"?"Ouvrir le PDF":"Ouvrir dans un nouvel onglet");a.href=url;a.target="_blank";a.rel="noopener";box.appendChild(a)}
function dlError(err){var c=err&&err.code;if(c==="declined")return;if(c==="rejected_extension")setStatus("Ce type de fichier ne peut pas être téléchargé depuis cette page.",true);else setStatus("Le téléchargement n'est pas disponible ici.",true)}
$("ed-dl").addEventListener("click",function(){var it=byId[state.id];if(!it||!downloads){setStatus("Le téléchargement n'est pas disponible ici.",true);return}var text=$("ed-text").value;if(!text){setStatus("Le fichier est vide.",true);return}downloads.save({filename:it.name,data:text}).catch(dlError)});
$("vw-dl").addEventListener("click",function(){var it=byId[state.id];if(!it||!downloads){setStatus("Le téléchargement n'est pas disponible ici.",true);return}fetch("/_blob/"+it.assetId).then(function(r){return r.blob()}).then(function(b){return downloads.save({filename:it.name,data:b})}).catch(dlError)});
var armedBtns=[];function twoTap(btn,label,action){var armed=false,t=null;function reset(){armed=false;clearTimeout(t);btn.textContent=label;btn.classList.remove("armed")}btn.addEventListener("click",function(){if(!armed){armed=true;btn.textContent="Toucher encore pour supprimer";btn.classList.add("armed");t=setTimeout(reset,4000)}else{reset();action()}});armedBtns.push(reset)}
function resetArmed(){armedBtns.forEach(function(r){r()})}
function descendants(id){var out=[],queue=[id];while(queue.length){var cur=queue.shift();children(cur).forEach(function(c){out.push(c);if(c.kind==="folder")queue.push(c.id)})}return out}
async function deleteTree(id){var it=byId[id];if(!it||!col)return;var all=descendants(id).concat([it]);busy=true;setStatus("Suppression…");try{for(var i=0;i<all.length;i++){var x=all[i];if(x.store==="asset"&&x.assetId&&assets){try{await assets.delete(x.assetId)}catch(e){}}await col.doc(x.id).delete();items=items.filter(function(y){return y.id!==x.id});delete byId[x.id]}setStatus("Supprimé.")}catch(err){setStatus(errText(err),true)}busy=false}
twoTap($("ed-del"),"Supprimer",function(){var it=byId[state.id];if(!it)return;dirty=false;var p=it.parent||"";deleteTree(it.id).then(function(){goFolder(p)})});
twoTap($("vw-del"),"Supprimer",function(){var it=byId[state.id];if(!it)return;var p=it.parent||"";deleteTree(it.id).then(function(){goFolder(p)})});
twoTap($("del-folder"),"Supprimer ce dossier",function(){var it=byId[state.folder];if(!it)return;var p=it.parent||"";deleteTree(it.id).then(function(){goFolder(p)})});
init();
